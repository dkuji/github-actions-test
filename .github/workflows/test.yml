name: test worlflow

on: [push, workflow_dispatch]

jobs:
  job1:
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      output1: ${{ steps.step1.outputs.test }}
      output2: ${{ steps.step2.outputs.test }}
      output4: ${{ steps.step4.outputs.test }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: step1
        run: echo "test=hello" >> "$GITHUB_OUTPUT"
      - id: step2
        run: echo "test=world" >> "$GITHUB_OUTPUT"
      - id: step3
        run: echo "::set-output name=test::$(date +\"%Y%m%d%H%M%S%6N\")-$(git rev-parse --short HEAD)"
      - id: step4
        run: echo "test=$(date +%Y%m%d%H%M%S%6N)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - env:
          OUTPUT1: ${{needs.job1.outputs.output1}}
          OUTPUT2: ${{needs.job1.outputs.output2}}
          OUTPUT3: ${{needs.job1.outputs.test}}
          OUTPUT4: ${{needs.job1.outputs.output4}}
        run: echo "$OUTPUT1 $OUTPUT2"
